<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300">
  <rect width="720" height="300" fill="#fff"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="24" y="34" font-size="20" font-weight="700" fill="#0f2233">CoinFlow architecture</text>
    <text x="24" y="56" font-size="14" fill="#4a5d6b">All calculations run in the browser; the server only stores each user's own rows</text>
    <!-- browser -->
    <rect x="24" y="80" width="300" height="196" rx="14" fill="#d8f3ee" stroke="#0b6e6e" stroke-width="2"/>
    <text x="40" y="106" font-size="15" font-weight="700" fill="#0f2233">Browser (phone / PC)</text>
    <text x="40" y="132" font-size="13" fill="#0f2233">Next.js + React pages, RO / RU / EN</text>
    <rect x="40" y="146" width="268" height="116" rx="10" fill="#fff" stroke="#3cc3b0"/>
    <text x="52" y="168" font-size="13" font-weight="700" fill="#0b6e6e">src/lib — pure functions (42 tests)</text>
    <text x="52" y="190" font-size="12.5" fill="#0f2233">• forecast: SMA (chosen by experiment)</text>
    <text x="52" y="210" font-size="12.5" fill="#0f2233">• payslip (Moldova 2026 rules)</text>
    <text x="52" y="230" font-size="12.5" fill="#0f2233">• goal estimate, what-if, money flow</text>
    <text x="52" y="250" font-size="12.5" fill="#0f2233">• money stored in bani (integers)</text>
    <!-- supabase -->
    <rect x="420" y="80" width="276" height="92" rx="14" fill="#fff4d6" stroke="#e0a91f" stroke-width="2"/>
    <text x="436" y="106" font-size="15" font-weight="700" fill="#0f2233">Supabase (PostgreSQL + Auth)</text>
    <text x="436" y="130" font-size="12.5" fill="#0f2233">4 tables · Row Level Security:</text>
    <text x="436" y="150" font-size="12.5" fill="#0f2233">auth.uid() = user_id</text>
    <!-- bnm -->
    <rect x="420" y="188" width="276" height="88" rx="14" fill="#fde3dc" stroke="#f2674a" stroke-width="2"/>
    <text x="436" y="214" font-size="15" font-weight="700" fill="#0f2233">API route /api/rates</text>
    <text x="436" y="236" font-size="12.5" fill="#0f2233">→ National Bank of Moldova XML</text>
    <text x="436" y="256" font-size="12.5" fill="#0f2233">fallback: sample rates if offline</text>
    <!-- arrows -->
    <g stroke="#0f2233" stroke-width="2" fill="none" marker-end="url(#a)">
      <path d="M324 126 H414"/><path d="M324 232 H414"/>
    </g>
    <text x="330" y="118" font-size="11.5" fill="#4a5d6b">login, own data</text>
    <text x="336" y="224" font-size="11.5" fill="#4a5d6b">daily rates</text>
  </g>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f2233"/></marker></defs>
</svg>
