<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoinFlow poster</title>
<!-- Printable stand poster. Open in Chrome, paste the live link, print (Background graphics: on). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&family=Unbounded:wght@700;800&display=swap&subset=latin-ext,cyrillic" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root { --ink:#0f2233; --soft:#4a5d6b; --mist:#eef5f4; --flow:#0b6e6e; --wave:#3cc3b0; --foam:#d8f3ee; --sun:#ffc845; --coral:#f2674a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #ccd; font-family: Onest, sans-serif; color: var(--ink); }
  .controls { max-width: 794px; margin: 16px auto; display: flex; gap: 8px; flex-wrap: wrap; padding: 0 16px; }
  .controls input { flex: 1; min-width: 220px; padding: 10px 14px; border-radius: 999px; border: 1px solid #aab; font: inherit; }
  .controls button { padding: 10px 16px; border-radius: 999px; border: 0; background: var(--flow); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .controls button.alt { background: #fff; color: var(--ink); }
  .page { width: 794px; height: 1123px; margin: 0 auto 32px; background: var(--mist); position: relative; overflow: hidden; padding: 56px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand span { font-family: Unbounded; font-weight: 800; font-size: 34px; }
  h1 { font-family: Unbounded; font-weight: 800; font-size: 56px; line-height: 1.05; margin: 36px 0 12px; }
  h1 em { font-style: normal; color: var(--flow); }
  .lead { font-size: 21px; color: var(--soft); max-width: 560px; margin: 0; }
  .hero { margin-top: 28px; background: var(--flow); color: #fff; border-radius: 28px; padding: 28px 32px 56px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; }
  .hero small { color: var(--foam); font-size: 17px; }
  .big { font-family: Unbounded; font-weight: 800; font-size: 58px; line-height: 1; margin-top: 6px; }
  .big span { font-size: 24px; color: var(--wave); }
  .hero img { height: 150px; }
  .wave { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; width: 100%; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 26px; }
  .card { background: #fff; border: 1px solid #d6e4e2; border-radius: 22px; padding: 16px 18px; }
  .card b { font-family: Unbounded; font-size: 16px; display: block; margin-bottom: 4px; }
  .card p { margin: 0; color: var(--soft); font-size: 15px; }
  .bottom { margin-top: auto; display: flex; align-items: center; gap: 24px; background: #fff; border-radius: 26px; padding: 20px 24px; border: 3px solid var(--sun); }
  .qr svg, .qr img { width: 150px; height: 150px; display: block; }
  .bottom b { font-family: Unbounded; font-size: 24px; display: block; }
  .bottom .url { color: var(--flow); font-weight: 700; font-size: 18px; word-break: break-all; }
  .sdg { margin-top: 8px; font-size: 15px; color: var(--soft); }
  @media print {
    @page { size: A4; margin: 0; }
    body { background: none; }
    .controls { display: none; }
    .page { margin: 0; box-shadow: none; }
  }
</style>
</head>
<body>
<div class="controls">
  <input id="url" placeholder="Paste the live link, e.g. https://coin-flow.vercel.app">
  <button class="alt" data-lang="ro">RO</button>
  <button class="alt" data-lang="en">EN</button>
  <button onclick="window.print()">Print</button>
</div>

<div class="page">
  <div class="brand">
    <img src="/logo.svg" width="56" height="56" alt="">
    <span>CoinFlow</span>
  </div>

  <h1 data-t="title"></h1>
  <p class="lead" data-t="lead"></p>

  <div class="hero">
    <div>
      <small data-t="habit"></small>
      <div class="big">45 625 <span>lei</span></div>
    </div>
    <img src="/illustrations/hero-flow.svg" alt="">
    <svg class="wave" viewBox="0 0 400 40" preserveAspectRatio="none"><path d="M0 20 C 50 0, 100 40, 150 20 S 250 0, 300 20 S 380 40, 400 20 V40 H0 Z" fill="#3cc3b0"/></svg>
  </div>

  <div class="grid" id="features"></div>

  <div class="bottom">
    <div class="qr" id="qr"></div>
    <div>
      <b data-t="scan"></b>
      <div class="url" id="urlText"></div>
      <div class="sdg" data-t="sdg"></div>
    </div>
  </div>
</div>

<script>
  const TEXT = {
    ro: {
      title: 'Banii tăi, <em>în flux.</em>',
      lead: 'Aplicație gratuită de finanțe personale pentru adolescenții din Moldova. În română, rusă și engleză.',
      habit: 'O cafea de 25 lei pe zi, în 5 ani:',
      scan: 'Scanează și încearcă',
      sdg: 'Obiectivele ONU: 4 Educație de calitate · 1 Fără sărăcie',
      features: [
        ['Cheltuieli în 2 atingeri', 'Suma + categoria. Vezi săptămâna dintr-o privire.'],
        ['Obiective-container', 'Fiecare obiectiv se umple ca un borcan, cu estimare de timp.'],
        ['Fluxul banilor', 'Vezi cum curg banii de la venituri la cheltuieli.'],
        ['Fluturașul de salariu', 'De la brut la net, fiecare impozit explicat simplu.'],
        ['Curs BNM', 'MDL ⇄ EUR, USD, RON, UAH la cursul oficial.'],
        ['Lecții + teste', 'Buget, economisire și cum recunoști o țeapă.'],
      ],
    },
    en: {
      title: 'Your money, <em>in flow.</em>',
      lead: 'A free personal finance app for teenagers in Moldova. In Romanian, Russian and English.',
      habit: 'A 25 lei coffee every day, in 5 years:',
      scan: 'Scan and try it',
      sdg: 'UN Goals: 4 Quality Education · 1 No Poverty',
      features: [
        ['Expenses in 2 taps', 'Amount + category. See your week at a glance.'],
        ['Goals as containers', 'Each goal fills up like a jar, with a time estimate.'],
        ['Money flow', 'See how money flows from income to spending.'],
        ['Payslip explainer', 'From gross to net, every tax explained simply.'],
        ['Official BNM rates', 'MDL ⇄ EUR, USD, RON, UAH at the official rate.'],
        ['Lessons + quizzes', 'Budgeting, saving and spotting scams.'],
      ],
    },
  };

  const read = (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } };
  const write = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

  let lang = read('poster-lang', 'ro');
  const urlInput = document.getElementById('url');
  urlInput.value = read('poster-url', '');

  function render() {
    const t = TEXT[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach((el) => (el.innerHTML = t[el.dataset.t]));
    document.getElementById('features').innerHTML = t.features
      .map(([title, text]) => `<div class="card"><b>${title}</b><p>${text}</p></div>`)
      .join('');

    const url = urlInput.value.trim() || 'https://github.com/i-c-js/coin-flow';
    document.getElementById('urlText').textContent = url.replace(/^https?:\/\//, '');
    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  }

  document.querySelectorAll('[data-lang]').forEach((b) =>
    b.addEventListener('click', () => { lang = b.dataset.lang; write('poster-lang', lang); render(); })
  );
  urlInput.addEventListener('input', () => { write('poster-url', urlInput.value); render(); });
  render();
</script>
</body>
</html>
